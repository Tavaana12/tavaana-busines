<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b32"><meta name="description" content="حسابداری آفلاین سلمانی و فروش لوازم جانبی موبایل"><link rel="manifest" href="manifest.webmanifest"><title>Tavaana Business</title>
<style>
:root{--green:#173b32;--green2:#245848;--bg:#f3f6f4;--card:#fff;--ink:#18231f;--muted:#718078;--line:#e4ebe7;--red:#b83d3d;--gold:#a97722}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:#fff;font-weight:700}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.top{background:linear-gradient(135deg,var(--green),#2c6551);color:#fff;padding:20px;border-radius:20px;margin-bottom:14px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.sub{color:#d0e2d8;font-size:12px;margin-top:5px}.pill{background:#ffffff20;padding:7px 10px;border-radius:20px;font-size:11px}.balance{margin-top:22px;font-size:27px;font-weight:800}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #183b3210}.metric small{display:block;color:var(--muted);margin-bottom:8px}.metric strong{font-size:18px}.section-title{font-weight:800;margin:18px 2px 10px}.actions button{width:100%;min-height:72px;text-align:right;background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;gap:10px}.ico{width:38px;height:38px;border-radius:12px;background:#e9f2ed;display:grid;place-items:center;font-size:19px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:4;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));}.tabs-inner{width:min(760px,100%);display:flex;justify-content:space-around}.tab{background:none;color:var(--muted);padding:7px 8px;font-size:11px;display:grid;gap:3px;justify-items:center}.tab.active{color:var(--green);background:#eaf2ed}.tab span:first-child{font-size:18px}.hidden{display:none!important}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}.row{display:flex;gap:9px}.row>*{flex:1}.primary{width:100%;margin-top:14px}.secondary{background:#eaf2ed;color:var(--green)}.danger{background:#fff0f0;color:var(--red)}.listitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.amount{font-weight:800;white-space:nowrap}.positive{color:#16734c}.negative{color:var(--red)}.note{font-size:11px;color:var(--muted);line-height:1.9}.empty{text-align:center;padding:24px;color:var(--muted)}.bar{height:9px;background:#edf1ee;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#3c8a68}.login{max-width:430px;margin:9vh auto;padding:18px}.toast{position:fixed;top:12px;left:12px;right:12px;max-width:500px;margin:auto;background:#173b32;color:#fff;padding:12px;border-radius:12px;z-index:10;text-align:center}.small{font-size:11px;color:var(--muted)}

:root{--tint:#eaf2ed}html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%;}body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}.wrap{width:100%;max-width:560px;margin:0 auto;padding:12px 12px calc(100px + env(safe-area-inset-bottom))}.top{border-radius:0 0 22px 22px;margin:-12px -12px 14px;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.menu-trigger{width:42px;height:42px;padding:0;border:1px solid #ffffff55;background:#ffffff18;color:#fff;font-size:22px;border-radius:13px}.welcome-line{font-size:12px;color:#d6e7df;margin-top:13px}.tabs{padding-bottom:calc(7px + env(safe-area-inset-bottom));}.tabs-inner{max-width:560px}.tab{min-width:54px}.tab.active{background:var(--tint);color:var(--green)}.card{min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{min-width:0;font-size:12px;padding:10px}.section-title{font-size:14px}.theme-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.theme-choice{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 4px;font-size:11px;display:grid;justify-items:center;gap:7px}.theme-choice i{width:25px;height:25px;border-radius:50%;background:var(--swatch);display:block}.theme-choice.selected{outline:2px solid var(--green);background:var(--tint)}.restore-label{display:block;text-align:center;padding:12px;border-radius:12px;margin-top:10px;background:var(--tint);color:var(--green);font-weight:700}.restore-label input{margin-top:8px}.about-hero{text-align:center;padding:22px 14px}.about-logo{width:64px;height:64px;border-radius:20px;background:var(--green);color:white;display:grid;place-items:center;margin:auto;font-size:22px;font-weight:900}.about-hero h2{margin:12px 0 5px}.about-hero p{color:var(--muted);margin:0 0 10px}.version-tag{display:inline-block;background:var(--tint);color:var(--green);padding:5px 10px;border-radius:30px;font-size:11px}.profile-avatar{width:54px;height:54px;border-radius:50%;background:var(--tint);color:var(--green);display:grid;place-items:center;font-size:24px;font-weight:800;margin:auto}.about-name{text-align:center;margin-bottom:3px}.about-copy{text-align:center;line-height:2}.contact-row{display:block;text-decoration:none;color:var(--green);padding:10px 4px;border-top:1px solid var(--line);text-align:center}.drawer-backdrop{position:fixed;inset:0;background:#0008;z-index:20}.drawer{position:fixed;z-index:21;top:0;bottom:0;right:0;width:min(82vw,330px);background:var(--card);padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));box-shadow:-12px 0 35px #0002;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}.drawer-close{background:var(--tint);color:var(--green);font-size:23px;padding:5px 12px}.drawer-link{width:100%;display:flex;align-items:center;gap:13px;text-align:right;background:transparent;color:var(--ink);margin:4px 0;padding:14px;border-radius:12px}.drawer-link span{width:28px;text-align:center;font-size:19px}.drawer-link.active{background:var(--tint);color:var(--green)}.low-stock{border-color:#e8c58c;background:#fff9ee;color:#8a5716}.low-stock .small{margin-top:7px;color:#8a5716}input,select,button{max-width:100%;}input,select{min-height:44px;font-size:16px}button{touch-action:manipulation}.row{flex-wrap:wrap}.row>*{min-width:0}@media(min-width:700px){.wrap{max-width:760px;padding-top:18px}.top{border-radius:22px;margin:0 0 16px;padding:22px}.drawer{width:320px}}@media(max-width:360px){.wrap{padding-left:9px;padding-right:9px}.grid{gap:7px}.card{padding:11px}.metric strong{font-size:15px}.tab{font-size:10px;min-width:46px}.theme-options{gap:5px}}

</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<nav class="tabs hidden" id="tabs"><div class="tabs-inner"><button class="tab active" data-page="home"><span>⌂</span>خانه</button><button class="tab" data-page="transactions"><span>＋</span>ثبت‌ها</button><button class="tab" data-page="stock"><span>▦</span>انبار</button><button class="tab" data-page="reports"><span>▤</span>گزارش</button><button class="tab" data-page="settings"><span>⚙</span>تنظیمات</button></div></nav>
<script type="module">
import { summarize, validateTransaction, calculateStock, normalizeProfile, normalizeTheme } from './core.js';
const KEY='tavaana_business_v1';
const blank=()=>({users:[],activeUser:null,transactions:[],products:[],movements:[],backup:null,profile:normalizeProfile(),theme:'green',createdAt:new Date().toISOString()});
let db=load(), page='home';
function load(){try{const data={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')};data.profile=normalizeProfile(data.profile);data.theme=normalizeTheme(data.theme);return data}catch{return blank()}}
function save(){db.backup={at:new Date().toISOString(),transactions:db.transactions,products:db.products,movements:db.movements,users:db.users};localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(KEY+'_auto_backup',JSON.stringify(db.backup))}
function money(n){return (Number(n)||0).toLocaleString('fa-IR')+' افغانی'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function dateKey(d=new Date()){return d.toISOString().slice(0,10)}
function show(){document.querySelector('#tabs').classList.toggle('hidden',!db.activeUser);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#app').innerHTML=db.activeUser?renderPage():renderLogin();applyTheme();bind()}
function renderLogin(){if(!db.users.length)return `<div class="login card"><div class="brand">Tavaana Business</div><p class="muted">ساخت حساب مدیر برای شروع برنامه</p><form id="setup"><label>نام مدیر</label><input name="name" required placeholder="مثلاً مدیر دکان"><label>نام کاربری</label><input name="username" required autocomplete="username"><label>رمز عبور یا PIN</label><input name="pin" required minlength="4" type="password" inputmode="numeric"><button class="primary">ساخت حساب و شروع</button></form><p class="note">اطلاعات روی همین گوشی ذخیره می‌شود. رمز را فراموش نکنید؛ بازیابی حساب بدون نسخه پشتیبان ممکن نیست.</p></div>`;
return `<div class="login card"><div class="brand">Tavaana Business</div><p class="muted">ورود به حساب کاربری</p><form id="login"><label>نام کاربری</label><input name="username" required autocomplete="username"><label>رمز عبور یا PIN</label><input name="pin" type="password" required autocomplete="current-password"><button class="primary">ورود</button></form><p class="note">حساب‌های کاربری این نسخه روی یک گوشی و به‌صورت محلی کار می‌کنند.</p></div>`}
function renderPage(){const views={home,transactions,stock,reports,settings,about};return `<main class="wrap">${(views[page]||home)()}</main>${drawer()}`}
function header(){return `<header class="top"><div class="topline"><div><div class="brand">Tavaana Business</div><div class="sub">مدیریت سلمانی و لوازم جانبی موبایل</div></div><button class="menu-trigger" data-action="menu" aria-label="باز کردن منو">☰</button></div><div class="welcome-line">سلام، ${esc(db.activeUser.name)} 👋</div></header>`}
function home(){const today=db.transactions.filter(x=>x.date===dateKey());const s=summarize(today);const stockValue=db.products.reduce((a,p)=>a+(Number(p.qty)||0),0);return `${header()}<div class="card"><small class="muted">سود خالص امروز</small><div class="balance" style="color:var(--green)">${money(s.netProfit)}</div><div class="note">درآمد منهای هزینه‌های جاری و بهای خرید کالای فروخته‌شده</div></div><div class="grid"><div class="card metric"><small>درآمد امروز</small><strong>${money(s.totalRevenue)}</strong></div><div class="card metric"><small>هزینه امروز</small><strong>${money(s.expenses)}</strong></div><div class="card metric"><small>درآمد سلمانی</small><strong>${money(s.barberRevenue)}</strong></div><div class="card metric"><small>فروش موبایل</small><strong>${money(s.mobileRevenue)}</strong></div></div><div class="section-title">دسترسی سریع</div><div class="grid actions"><button data-action="add-barber"><span class="ico">✂</span>ثبت درآمد سلمانی</button><button data-action="add-sale"><span class="ico">📱</span>ثبت فروش موبایل</button><button data-action="add-expense"><span class="ico">＋</span>ثبت هزینه</button><button data-action="add-product"><span class="ico">▣</span>افزودن کالا</button></div><div class="section-title">آخرین ثبت‌ها</div><div class="card">${recent(5)}</div><p class="note">موجودی کالا: ${stockValue.toLocaleString('fa-IR')} عدد · تمام مبالغ به افغانی هستند.</p>`}
function recent(n=20){const rows=[...db.transactions].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,n);return rows.length?rows.map(x=>`<div class="listitem"><div><b>${esc(x.title)}</b><div class="small">${esc(x.date)} · ${sectionName(x.section)}</div></div><div class="amount ${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):'<div class="empty">هنوز ثبتی وجود ندارد.</div>'}
function sectionName(s){return ({barber:'سلمانی',mobile:'لوازم موبایل',general:'عمومی',other:'متفرقه'})[s]||s}
function transactions(){return `${header()}<div class="section-title">ثبت درآمد یا هزینه</div><div class="grid actions"><button data-action="add-barber"><span class="ico">✂</span>درآمد سلمانی</button><button data-action="add-sale"><span class="ico">📱</span>فروش کالا</button><button data-action="add-expense"><span class="ico">＋</span>هزینه جدید</button><button data-action="add-income"><span class="ico">＋</span>درآمد متفرقه</button></div><div class="section-title">همه تراکنش‌ها</div><div class="card">${recent(100)}</div>`}
function stock(){const total=db.products.reduce((n,p)=>n+(Number(p.qty)||0),0),low=db.products.filter(p=>(Number(p.qty)||0)<=(Number(p.minQty)||2));return `${header()}<div class="topline"><div class="section-title">انبار کالا</div><button data-action="add-product">＋ افزودن کالا</button></div><div class="grid"><div class="card metric"><small>تعداد انواع کالا</small><strong>${db.products.length.toLocaleString('fa-IR')}</strong></div><div class="card metric"><small>مجموع موجودی</small><strong>${total.toLocaleString('fa-IR')}</strong></div></div>${low.length?`<div class="card low-stock"><b>⚠ کالاهای کم‌موجود</b><div class="small">${low.map(p=>esc(p.name)).join('، ')}</div></div>`:''}<div class="card">${db.products.length?db.products.map(p=>`<div class="listitem"><div><b>${esc(p.name)}</b><div class="small">${esc(p.category||'بدون دسته')} · کد: ${esc(p.code||'—')}</div><div class="small">خرید ${money(p.buy)} · فروش ${money(p.sell)}</div><div class="small">موجودی: ${Number(p.qty).toLocaleString('fa-IR')} عدد</div></div><button class="secondary" data-edit-product="${p.id}">ویرایش</button></div>`).join(''):'<div class="empty">هنوز کالایی ثبت نشده است.</div>'}</div><p class="note">فهرست کالا، قیمت خرید و فروش و هشدار کمبود موجودی در این بخش مدیریت می‌شود. کاهش خودکار موجودی هنگام فروش در مرحله توسعه بعدی اضافه خواهد شد.</p>`}
function reports(){const s=summarize(db.transactions);const byMonth={};db.transactions.forEach(x=>{const k=x.date.slice(0,7);byMonth[k]??=[];byMonth[k].push(x)});return `${header()}<div class="section-title">خلاصه کل دوره</div><div class="grid"><div class="card metric"><small>کل درآمد</small><strong>${money(s.totalRevenue)}</strong></div><div class="card metric"><small>کل هزینه</small><strong>${money(s.expenses+s.costOfGoods)}</strong></div><div class="card metric"><small>سود خالص</small><strong>${money(s.netProfit)}</strong></div><div class="card metric"><small>تعداد ثبت‌ها</small><strong>${db.transactions.length.toLocaleString('fa-IR')}</strong></div></div><div class="section-title">تفکیک درآمد</div><div class="card"><div class="listitem"><span>سلمانی</span><b>${money(s.barberRevenue)}</b></div><div class="listitem"><span>لوازم موبایل</span><b>${money(s.mobileRevenue)}</b></div><div class="listitem"><span>هزینه جاری</span><b>${money(s.expenses)}</b></div><div class="listitem"><span>بهای خرید کالای فروخته‌شده</span><b>${money(s.costOfGoods)}</b></div></div><div class="section-title">گزارش ماهانه</div><div class="card">${Object.keys(byMonth).sort().reverse().map(k=>{const v=summarize(byMonth[k]);return `<div class="listitem"><div><b>${k}</b><div class="small">${byMonth[k].length} ثبت</div></div><b>${money(v.netProfit)}</b></div>`}).join('')||'<div class="empty">داده‌ای برای گزارش نیست.</div>'}</div>`}
function settings(){const colors=[['green','سبز','#173b32'],['blue','آبی','#2456a6'],['purple','بنفش','#7046a5'],['orange','نارنجی','#b65a24']];return `${header()}<div class="section-title">تنظیمات ظاهری</div><div class="card"><div class="note">رنگ اصلی برنامه را انتخاب کن.</div><div class="theme-options">${colors.map(([v,n,c])=>`<button class="theme-choice ${db.theme===v?'selected':''}" data-theme="${v}" style="--swatch:${c}"><i></i>${n}</button>`).join('')}</div></div><div class="section-title">مشخصات صاحب برنامه</div><div class="card"><form id="profileform"><label>نام و نام خانوادگی</label><input name="name" required value="${esc(db.profile.name)}"><label>عنوان شغلی</label><input name="title" value="${esc(db.profile.title)}"><label>شماره تماس</label><input name="phone" type="tel" value="${esc(db.profile.phone)}" placeholder="شماره تماس خود را وارد کن"><label>ایمیل</label><input name="email" type="email" value="${esc(db.profile.email)}" placeholder="ایمیل خود را وارد کن"><label>آدرس (اختیاری)</label><input name="address" value="${esc(db.profile.address)}"><button class="primary">ذخیره مشخصات</button></form></div><div class="section-title">مدیریت کاربران</div><div class="card">${db.users.map(u=>`<div class="listitem"><div><b>${esc(u.name)}</b><div class="small">${esc(u.username)} · ${u.role==='admin'?'مدیر':'کاربر'}</div></div>${u.id===db.activeUser.id?'<span class="pill" style="background:#eaf2ed;color:var(--green)">فعال</span>':''}</div>`).join('')}<button class="primary" data-action="add-user">＋ افزودن کاربر</button></div><div class="section-title">پشتیبان‌گیری</div><div class="card"><p class="note">پشتیبان خودکار داخلی: ${db.backup?.at?new Date(db.backup.at).toLocaleString('fa-IR'):'هنوز ایجاد نشده'}<br>برای حفاظت در برابر پاک‌شدن داده‌های مرورگر، فایل پشتیبان دستی را هم در جای دیگری نگهداری کن.</p><button class="primary" data-action="export">دریافت نسخه پشتیبان JSON</button><label class="restore-label">بازیابی نسخه پشتیبان<input id="restore" type="file" accept="application/json"></label></div><div class="section-title">حساب کاربری</div><div class="card"><button class="secondary" data-action="logout">خروج از حساب</button><button class="danger primary" data-action="clear">پاک کردن تمام اطلاعات</button></div><p class="note">نسخه دوم · موبایل‌محور · آفلاین · افغانی (AFN)</p>`}
function about(){return `${header()}<section class="about-hero card"><div class="about-logo">TB</div><h2>Tavaana Business</h2><p>نرم‌افزار مدیریت و حسابداری کسب‌وکار</p><span class="version-tag">نسخه ۲٫۰</span></section><div class="section-title">درباره نرم‌افزار</div><div class="card about-copy">Tavaana Business برای مدیریت یکپارچه درآمد و هزینه‌های سلمانی و فروش لوازم جانبی موبایل طراحی شده است. این برنامه امکان ثبت تراکنش‌ها، مدیریت انبار، گزارش‌گیری و پشتیبان‌گیری را فراهم می‌کند و اطلاعات را روی همین دستگاه نگهداری می‌کند.</div><div class="section-title">درباره من</div><div class="card"><div class="profile-avatar">${esc((db.profile.name||'T').trim().slice(0,1))}</div><h3 class="about-name">${esc(db.profile.name)}</h3><p class="muted about-copy">${esc(db.profile.title)}</p>${db.profile.phone?`<a class="contact-row" href="tel:${esc(db.profile.phone)}">☎ ${esc(db.profile.phone)}</a>`:'<p class="contact-row muted">شماره تماس هنوز ثبت نشده است.</p>'}${db.profile.email?`<a class="contact-row" href="mailto:${esc(db.profile.email)}">✉ ${esc(db.profile.email)}</a>`:'<p class="contact-row muted">ایمیل هنوز ثبت نشده است.</p>'}${db.profile.address?`<p class="contact-row">⌖ ${esc(db.profile.address)}</p>`:''}<button class="secondary primary" data-page-link="settings">ویرایش مشخصات</button></div><p class="note about-copy">ساخته‌شده برای مدیریت ساده‌تر کسب‌وکار · Tavaana</p>`}
function drawer(){return `<div class="drawer-backdrop hidden" id="drawer-backdrop" data-action="close-menu"></div><aside class="drawer hidden" id="drawer"><div class="drawer-head"><b>Tavaana Business</b><button class="drawer-close" data-action="close-menu">×</button></div>${[['home','⌂','داشبورد'],['transactions','＋','درآمد و هزینه'],['stock','▦','انبار کالا'],['reports','▤','گزارش‌ها'],['settings','⚙','تنظیمات'],['about','ⓘ','درباره نرم‌افزار']].map(([p,i,t])=>`<button class="drawer-link ${page===p?'active':''}" data-drawer-page="${p}"><span>${i}</span>${t}</button>`).join('')}</aside>`}
function applyTheme(){const themes={green:['#173b32','#245848','#eaf2ed'],blue:['#21477e','#2f65aa','#eaf1fb'],purple:['#553779','#754da0','#f1eafa'],orange:['#8c431e','#b65a24','#fff0e6']};const c=themes[normalizeTheme(db.theme)];document.documentElement.style.setProperty('--green',c[0]);document.documentElement.style.setProperty('--green2',c[1]);document.documentElement.style.setProperty('--tint',c[2]);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',c[0])}

function modal(title,body){const old=document.querySelector('#modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0008;z-index:8;display:grid;align-items:end"><div style="background:#f3f6f4;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto;width:min(760px,100%);margin:auto"><div class="topline"><b>${title}</b><button class="secondary" id="close-modal">بستن</button></div>${body}</div></div>`);document.querySelector('#close-modal').onclick=()=>document.querySelector('#modal').remove();}
function transactionForm(type,section){const expense=type==='expense';modal(expense?'ثبت هزینه':'ثبت درآمد',`<form id="txform"><label>عنوان</label><input name="title" required placeholder="مثلاً اصلاح مو / قاب موبایل / کرایه دکان"><div class="row"><div><label>مبلغ (افغانی)</label><input name="amount" type="number" min="1" step="1" required></div><div><label>تاریخ</label><input name="date" type="date" value="${dateKey()}" required></div></div><label>بخش</label><select name="section">${(expense?[['general','عمومی'],['barber','سلمانی'],['mobile','لوازم موبایل']]:[['barber','سلمانی'],['mobile','لوازم موبایل'],['other','متفرقه']]).map(([v,l])=>`<option value="${v}" ${section===v?'selected':''}>${l}</option>`).join('')}</select>${!expense?'<label>بهای خرید کالای فروخته‌شده (فقط فروش موبایل؛ در غیر آن صفر)</label><input name="cost" type="number" min="0" value="0">':''}<label>یادداشت (اختیاری)</label><input name="note"><button class="primary">ذخیره ثبت</button></form>`);document.querySelector('#txform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const row={id:id(),type,section:f.get('section'),title:f.get('title').trim(),amount:Number(f.get('amount')),cost:Number(f.get('cost')||0),date:f.get('date'),note:f.get('note'),createdAt:new Date().toISOString(),userId:db.activeUser.id};const error=validateTransaction(row);if(error)return toast(error);db.transactions.push(row);save();document.querySelector('#modal').remove();show();toast('ثبت با موفقیت ذخیره شد.')}}
function productForm(product){modal(product?'ویرایش کالا':'افزودن کالا',`<form id="pform"><label>نام کالا</label><input name="name" required value="${esc(product?.name||'')}"><label>دسته‌بندی</label><input name="category" value="${esc(product?.category||'لوازم جانبی موبایل')}" placeholder="مثلاً قاب، شارژر، هندزفری"><div class="row"><div><label>کد کالا</label><input name="code" value="${esc(product?.code||'')}"></div><div><label>موجودی فعلی</label><input name="qty" type="number" min="0" value="${product?.qty??0}" required></div></div><div class="row"><div><label>حد هشدار موجودی</label><input name="minQty" type="number" min="0" value="${product?.minQty??2}"></div><div><label>قیمت خرید</label><input name="buy" type="number" min="0" value="${product?.buy??0}" required></div></div><label>قیمت فروش</label><input name="sell" type="number" min="0" value="${product?.sell??0}" required><button class="primary">ذخیره کالا</button></form>`);document.querySelector('#pform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={id:product?.id||id(),name:f.get('name').trim(),category:f.get('category').trim(),code:f.get('code').trim(),qty:Number(f.get('qty')),minQty:Number(f.get('minQty')),buy:Number(f.get('buy')),sell:Number(f.get('sell'))};if(product)db.products=db.products.map(p=>p.id===product.id?item:p);else db.products.push(item);save();document.querySelector('#modal').remove();show();toast('کالا ذخیره شد.')}}
function bind(){document.querySelector('#profileform')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.profile=normalizeProfile(Object.fromEntries(f.entries()));save();show();toast('مشخصات ذخیره شد.')});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{db.theme=normalizeTheme(b.dataset.theme);save();show();toast('رنگ برنامه تغییر کرد.')});document.querySelectorAll('[data-drawer-page]').forEach(b=>b.onclick=()=>{page=b.dataset.drawerPage;show()});document.querySelectorAll('[data-page-link]').forEach(b=>b.onclick=()=>{page=b.dataset.pageLink;show()});document.querySelectorAll('[data-action=menu]').forEach(b=>b.onclick=()=>{document.querySelector('#drawer')?.classList.remove('hidden');document.querySelector('#drawer-backdrop')?.classList.remove('hidden')});document.querySelectorAll('[data-action=close-menu]').forEach(b=>b.onclick=()=>{document.querySelector('#drawer')?.classList.add('hidden');document.querySelector('#drawer-backdrop')?.classList.add('hidden')});document.querySelector('#setup')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.users.push({id:id(),name:f.get('name').trim(),username:f.get('username').trim().toLowerCase(),pin:f.get('pin'),role:'admin'});db.activeUser=db.users[0];save();show()});document.querySelector('#login')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),u=db.users.find(x=>x.username===f.get('username').trim().toLowerCase()&&x.pin===f.get('pin'));if(!u)return toast('نام کاربری یا رمز نادرست است.');db.activeUser=u;save();show()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{page=b.dataset.page;show()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='add-barber')transactionForm('income','barber');if(a==='add-sale')transactionForm('income','mobile');if(a==='add-expense')transactionForm('expense');if(a==='add-income')transactionForm('income','other');if(a==='add-product')productForm();if(a==='add-user')userForm();if(a==='logout'){db.activeUser=null;save();show()}if(a==='export')exportBackup();if(a==='clear'&&confirm('تمام اطلاعات برنامه پاک شود؟ این کار برگشت‌پذیر نیست.')){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_auto_backup');db=blank();show()}});document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productForm(db.products.find(p=>p.id===b.dataset.editProduct)));document.querySelector('#restore')?.addEventListener('change',restoreBackup)}
function userForm(){modal('افزودن کاربر',`<form id="uform"><label>نام</label><input name="name" required><label>نام کاربری</label><input name="username" required><label>رمز عبور یا PIN</label><input name="pin" type="password" minlength="4" required><label>سطح دسترسی</label><select name="role"><option value="staff">کاربر</option><option value="admin">مدیر</option></select><button class="primary">ساخت کاربر</button></form>`);document.querySelector('#uform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),username=f.get('username').trim().toLowerCase();if(db.users.some(u=>u.username===username))return toast('این نام کاربری قبلاً ثبت شده است.');db.users.push({id:id(),name:f.get('name').trim(),username,pin:f.get('pin'),role:f.get('role')});save();document.querySelector('#modal').remove();show();toast('کاربر جدید اضافه شد.')}}
function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tavaana-Business-Backup-'+dateKey()+'.json';a.click();URL.revokeObjectURL(a.href);toast('فایل پشتیبان آماده شد.')}
function restoreBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.users)||!Array.isArray(data.transactions)||!Array.isArray(data.products))throw Error();if(!confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟'))return;db={...blank(),...data,activeUser:null};save();show();toast('بازیابی انجام شد؛ دوباره وارد شوید.')}catch{toast('فایل پشتیبان معتبر نیست.')}};r.readAsText(file)}
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
show();
</script></body></html>
