<html lang="fa" dir="rtl">
<head>

<link rel="manifest" href="manifest.webmanifest"><title>Tavaana Business V3</title>
<style>
:root{color-scheme:light;--brand:#123b32;--brand2:#1e6653;--tint:#e8f3ed;--bg:#f3f6f4;--surface:#fff;--ink:#182722;--muted:#72817a;--line:#e3ebe6;--red:#c34747;--amber:#a66c18;--green:#18764e;--shadow:0 10px 30px #193d3010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Tahoma,Arial,sans-serif;min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 15px;background:var(--brand);color:#fff;font-weight:700;transition:transform .18s,filter .18s,box-shadow .18s}button:active{transform:scale(.97)}button:hover{filter:brightness(1.06)}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--tint)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.app{max-width:1180px;margin:auto;padding:16px 16px 100px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 20px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:white;border-radius:22px;box-shadow:0 14px 35px #123b3228}.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}.sub{font-size:11px;color:#cce1d7;margin-top:5px}.userline{font-size:12px;color:#d7e8df;margin-top:12px}.top-actions{display:flex;gap:8px}.ghost{background:#ffffff18;border:1px solid #ffffff38}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;margin-top:16px}.side{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;height:max-content;position:sticky;top:12px}.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;color:var(--muted);margin:3px 0;padding:12px}.nav.active{background:var(--tint);color:var(--brand)}.nav i{font-style:normal;font-size:18px;width:24px;text-align:center}.content{min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:3px 0 14px}.page-head h2{margin:0;font-size:19px}.muted,.hint{color:var(--muted)}.hint{font-size:11px;line-height:1.9}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);min-width:0}.metric small{display:block;color:var(--muted);margin-bottom:10px}.metric strong{font-size:19px;letter-spacing:-.4px}.metric .trend{font-size:11px;color:var(--muted);margin-top:8px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:13px}.section{font-weight:800;margin:17px 2px 10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{background:var(--surface);color:var(--ink);border:1px solid var(--line);text-align:right;display:flex;align-items:center;gap:9px;min-height:68px}.quick b{font-size:20px;color:var(--brand);background:var(--tint);width:38px;height:38px;border-radius:12px;display:grid;place-items:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:170px}.secondary{background:var(--tint);color:var(--brand)}.danger{background:#fff0f0;color:var(--red)}.warning{background:#fff6e8;color:var(--amber)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:right;padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);background:#f8faf9}tr:last-child td{border:0}.badge{display:inline-block;border-radius:20px;padding:5px 9px;background:var(--tint);color:var(--brand);font-size:11px}.badge.red{background:#fff0f0;color:var(--red)}.badge.amber{background:#fff5e5;color:var(--amber)}.positive{color:var(--green)}.negative{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{min-width:110px}.lineitem{display:grid;grid-template-columns:minmax(0,2fr) .7fr .9fr 38px;gap:8px;align-items:end;margin:9px 0}.remove{background:#fff0f0;color:var(--red);padding:10px}.totalbox{background:var(--tint);padding:13px;border-radius:13px;margin-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.bottomnav{display:none}.overlay{position:fixed;inset:0;background:#071a1680;z-index:20;display:grid;place-items:center;padding:14px}.modal{width:min(720px,100%);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:20px;padding:17px;box-shadow:0 25px 80px #0003;animation:rise .2s ease}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h3{margin:0}.toast{position:fixed;z-index:50;bottom:22px;left:50%;transform:translateX(-50%);background:#102c27;color:white;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px #0003;max-width:90vw;text-align:center}.hidden{display:none!important}.login{width:min(420px,calc(100% - 28px));margin:9vh auto}.login .card{padding:24px}.login h1{margin:0;color:var(--brand)}.login button{width:100%;margin-top:17px}.activity{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid white;outline:1px solid var(--line)}.swatch.active{outline:3px solid var(--brand)}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.bottomnav{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.bottomnav button{background:transparent;color:var(--muted);padding:7px 5px;display:grid;gap:3px;justify-items:center;font-size:10px;min-width:52px}.bottomnav button.active{color:var(--brand);background:var(--tint)}.bottomnav span{font-size:18px}.app{padding:10px 10px 90px}.topbar{border-radius:0 0 19px 19px;margin:-10px -10px 0;padding:calc(15px + env(safe-area-inset-top)) 14px 16px}.page-head h2{font-size:17px}}@media(max-width:420px){.cards{gap:8px}.card{padding:12px}.metric strong{font-size:16px}.quick{gap:7px}.quick button{font-size:11px;padding:8px}.lineitem{grid-template-columns:1fr 1fr}.lineitem .wide{grid-column:1/-1}.top-actions .hide-small{display:none}.brand{font-size:18px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import {processSale,recordReceipt,calculateSaleTotals,recordPurchase,recordSupplierPayment,recordExpense} from './core-v3.js';
const KEY='tavaana_business_v1', V3='tavaana_business_v3';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10), money=n=>(Number(n)||0).toLocaleString('fa-IR')+' افغانی';
let db=load(),page='home',query='',draftItems=[];
function blank(){return {users:[],activeUser:null,transactions:[],products:[],movements:[],customers:[],suppliers:[],sales:[],purchases:[],cashbox:0,cashMovements:[],activities:[],profile:{name:'Mohammad Ali Tavaana',title:'مدیر کسب‌وکار',phone:'',email:'',address:''},theme:'green',settings:{}}}
function load(){try{let old=JSON.parse(localStorage.getItem(KEY)||'{}'),v3=JSON.parse(localStorage.getItem(V3)||'{}');let d={...blank(),...old,...v3};for(const key of ['users','transactions','products','movements','customers','suppliers','sales','purchases','cashMovements','activities']){if(Array.isArray(old[key])&&Array.isArray(v3[key])&&v3[key].length===0&&old[key].length>0)d[key]=old[key]}d.products??=[];d.users??=[];d.transactions??=[];d.customers??=[];d.suppliers??=[];d.sales??=[];d.purchases??=[];d.cashMovements??=[];d.activities??=[];d.movements??=[];d.profile={...blank().profile,...d.profile};return d}catch{return blank()}}
function save(){localStorage.setItem(V3,JSON.stringify(db));localStorage.setItem(KEY,JSON.stringify({...JSON.parse(localStorage.getItem(KEY)||'{}'),...db}))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),2600)}
function log(type,description,amount=0){db.activities.unshift({id:uid(),type,description,amount,date:today(),time:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),user:db.activeUser?.name||'مدیر'});db.activities=db.activities.slice(0,500)}
function applyTheme(){let c={green:['#123b32','#1e6653','#e8f3ed'],blue:['#1d3d72','#3267ad','#eaf1fc'],purple:['#513575','#8052a5','#f2ebfa'],orange:['#873e1c','#bd622d','#fff0e6']}[db.theme]||['#123b32','#1e6653','#e8f3ed'];document.documentElement.style.setProperty('--brand',c[0]);document.documentElement.style.setProperty('--brand2',c[1]);document.documentElement.style.setProperty('--tint',c[2]);document.querySelector('meta[name=theme-color]').content=c[0]}
const pages=[['home','⌂','خانه'],['sales','＋','فروش'],['stock','▦','انبار'],['people','♙','اشخاص'],['cash','◉','صندوق'],['reports','▤','گزارش'],['activity','◷','فعالیت'],['settings','⚙','تنظیمات']];
function render(){applyTheme();if(db.activeUser&&db.activeUser.role!=='admin'&&page==='settings'){page='home';toast('دسترسی تنظیمات فقط برای مدیر است.')}if(!db.activeUser){$('#app').innerHTML=login();return bindLogin()}$('#app').innerHTML='<div class="app">'+header()+'<div class="layout"><aside class="side">'+pages.map(([p,i,t])=>'<button class="nav '+(page===p?'active':'')+'" data-page="'+p+'"><i>'+i+'</i>'+t+'</button>').join('')+'</aside><main class="content">'+(views[page]||home)()+'</main></div></div><nav class="bottomnav">'+pages.slice(0,5).map(([p,i,t])=>'<button class="'+(page===p?'active':'')+'" data-page="'+p+'"><span>'+i+'</span>'+t+'</button>').join('')+'</nav>';bind()}
function header(){return '<header class="topbar"><div><div class="brand">Tavaana Business <span style="font-size:10px;opacity:.7">V3</span></div><div class="sub">مدیریت هوشمند کسب‌وکار · کاملاً آفلاین</div><div class="userline">خوش آمدی، '+esc(db.activeUser.name)+'</div></div><div class="top-actions"><button class="ghost hide-small" data-act="backup">پشتیبان</button><button class="ghost" data-act="logout">خروج</button></div></header>'}
function login(){return '<div class="login"><div class="card"><div class="brand">Tavaana Business</div><div class="sub" style="color:var(--muted)">نسخه سوم · مدیریت آفلاین</div>'+(!db.users.length?'<h2>ساخت حساب مدیر</h2><form id="setup"><label>نام مدیر</label><input name="name" required value="Mohammad Ali Tavaana"><label>نام کاربری</label><input name="username" required autocomplete="username"><label>رمز عبور</label><input name="pin" type="password" minlength="8" required><button>ساخت حساب و شروع</button></form>':'<h2>ورود به برنامه</h2><form id="login"><label>نام کاربری</label><input name="username" required autocomplete="username"><label>رمز عبور</label><input name="pin" type="password" required autocomplete="current-password"><button>ورود</button></form><button type="button" class="secondary" id="recover" style="width:100%;margin-top:10px">بازیابی رمز با کلید مدیر</button>')+'<p class="hint">اطلاعات فقط در حافظه همین دستگاه نگهداری می‌شود. برای انتقال به دستگاه دیگر از پشتیبان‌گیری استفاده کن.</p></div></div>'}
function legacyCost(){return db.transactions.filter(x=>x.type==='income'&&x.section==='mobile').reduce((a,x)=>a+Number(x.cost||0),0)}
function home(){let rev=db.sales.reduce((a,s)=>a+s.revenue,0)+db.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),cost=db.sales.reduce((a,s)=>a+s.costOfGoods,0)+legacyCost(),exp=db.transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),profit=rev-cost-exp,low=db.products.filter(p=>p.qty<=Number(p.minQty||2));return '<div class="page-head"><h2>داشبورد</h2><span class="badge">امروز '+today()+'</span></div><section class="cards"><div class="card metric"><small>صندوق مرکزی</small><strong>'+money(db.cashbox)+'</strong><div class="trend">موجودی نقدی فعلی</div></div><div class="card metric"><small>کل فروش</small><strong>'+money(rev)+'</strong><div class="trend">درآمد ثبت‌شده</div></div><div class="card metric"><small>سود خالص تقریبی</small><strong class="'+(profit<0?'negative':'positive')+'">'+money(profit)+'</strong><div class="trend">فروش منهای بهای کالا و هزینه</div></div><div class="card metric"><small>بدهی مشتریان</small><strong>'+money(db.customers.reduce((a,c)=>a+Number(c.balance||0),0))+'</strong><div class="trend">مانده حساب مشتریان</div></div></section><div class="section">دسترسی سریع</div><div class="quick"><button data-act="new-sale"><b>＋</b>ثبت فروش جدید</button><button data-act="new-product"><b>▦</b>افزودن کالا</button><button data-act="new-expense"><b>−</b>ثبت هزینه</button><button data-act="new-income"><b>＋</b>درآمد خدمات</button><button data-act="new-receipt"><b>↙</b>دریافت وجه</button></div><div class="two"><section><div class="section">آخرین فعالیت‌ها</div><div class="card">'+activityRows(6)+'</div></section><section><div class="section">هشدار موجودی</div><div class="card">'+(low.length?low.map(p=>'<div class="activity"><span>'+esc(p.name)+'</span><b class="negative">'+p.qty+' عدد</b></div>').join(''):'<div class="empty">موجودی کالاها مناسب است.</div>')+'</div></section></div>'}
function activityRows(n=30){return db.activities.filter(a=>(String(a.description||'')+' '+String(a.type||'')+' '+String(a.user||'')).toLowerCase().includes(query.toLowerCase())).slice(0,n).map(a=>'<div class="activity"><div><b>'+esc(a.description)+'</b><div class="hint">'+esc(a.date)+' · '+esc(a.time||'')+' · '+esc(a.user||'')+'</div></div><b>'+ (a.amount?money(a.amount):'')+'</b></div>').join('')||'<div class="empty">هنوز فعالیتی ثبت نشده است.</div>'}
function sales(){return '<div class="page-head"><h2>فروش‌ها</h2><button data-act="new-sale">＋ فروش جدید</button></div><div class="cards"><div class="card metric"><small>تعداد فاکتورها</small><strong>'+db.sales.length+'</strong></div><div class="card metric"><small>سود فروش</small><strong>'+money(db.sales.reduce((a,s)=>a+s.profit,0))+'</strong></div></div><div class="card">'+table(['تاریخ','شماره','مشتری','فروش','بهای تمام‌شده','سود','پرداخت','باقی'],db.sales.slice().reverse().map(s=>[s.date,s.id.slice(0,7),db.customers.find(c=>c.id===s.customerId)?.name||'نقدی',money(s.revenue),money(s.costOfGoods),money(s.profit),money(s.paidAmount),money(s.outstanding)]))+'</div>'}
function stock(){return '<div class="page-head"><h2>انبار کالا</h2><button data-act="new-product">＋ افزودن کالا</button></div><div class="toolbar"><input id="search" placeholder="جستجوی نام، کد یا دسته‌بندی..." value="'+esc(query)+'"><button class="secondary" data-act="new-purchase">ثبت خرید کالا</button></div><div class="card">'+table(['نام کالا','کد','دسته','موجودی','خرید','فروش','سود واحد','عملیات'],db.products.filter(p=>(p.name+' '+p.code+' '+p.category).toLowerCase().includes(query.toLowerCase())).map(p=>[p.name,p.code||'—',p.category||'—',p.qty+' عدد',money(p.buy),money(p.sell),money(p.sell-p.buy),'<button class="secondary" data-edit="'+p.id+'">ویرایش</button>']))+'</div>'}
function people(){return '<div class="page-head"><h2>مشتریان و تأمین‌کنندگان</h2><div class="actions"><button data-act="new-customer">＋ مشتری</button><button class="secondary" data-act="new-supplier">＋ تأمین‌کننده</button></div></div><div class="two"><div class="card"><div class="section">مشتریان و بدهکاران</div>'+table(['نام','تماس','مانده بدهی','عملیات'],db.customers.map(c=>[c.name,c.phone||'—',money(c.balance||0),'<button class="secondary" data-receive="'+c.id+'">دریافت</button>']))+'</div><div class="card"><div class="section">تأمین‌کنندگان و بستانکاران</div>'+table(['نام','تماس','مانده طلب'],db.suppliers.map(s=>[s.name,s.phone||'—',money(s.balance||0)]))+'</div></div>'}
function cash(){let ins=db.cashMovements.filter(x=>x.direction==='in').reduce((a,x)=>a+x.amount,0),outs=db.cashMovements.filter(x=>x.direction==='out').reduce((a,x)=>a+x.amount,0);return '<div class="page-head"><h2>صندوق مرکزی</h2><div class="actions"><button data-act="new-receipt">＋ دریافت</button><button class="danger" data-act="new-payment">− پرداخت</button></div></div><div class="cards"><div class="card metric"><small>موجودی فعلی</small><strong>'+money(db.cashbox)+'</strong></div><div class="card metric"><small>مجموع دریافت‌ها</small><strong class="positive">'+money(ins)+'</strong></div><div class="card metric"><small>مجموع پرداخت‌ها</small><strong class="negative">'+money(outs)+'</strong></div></div><div class="card">'+table(['تاریخ','نوع','شرح','مبلغ','جهت'],db.cashMovements.slice().reverse().map(m=>[m.date,m.kind,m.description,money(m.amount),m.direction==='in'?'دریافت':'پرداخت']))+'</div>'}
function reports(){let revenue=db.sales.reduce((a,s)=>a+s.revenue,0)+db.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),cogs=db.sales.reduce((a,s)=>a+s.costOfGoods,0)+legacyCost(),expenses=db.transactions.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),profit=revenue-cogs-expenses;return '<div class="page-head"><h2>گزارش‌های مالی</h2><button class="secondary" data-act="export-csv">خروجی CSV فروش</button></div><div class="cards"><div class="card metric"><small>درآمد</small><strong>'+money(revenue)+'</strong></div><div class="card metric"><small>بهای تمام‌شده</small><strong>'+money(cogs)+'</strong></div><div class="card metric"><small>هزینه‌ها</small><strong>'+money(expenses)+'</strong></div><div class="card metric"><small>سود خالص</small><strong class="'+(profit<0?'negative':'positive')+'">'+money(profit)+'</strong></div></div><div class="card"><div class="section">تفکیک حساب‌ها</div>'+table(['شرح','مبلغ'],[['فروش کالا',money(db.sales.reduce((a,s)=>a+s.revenue,0))],['درآمدهای دیگر',money(db.transactions.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0))],['بهای کالای فروخته‌شده',money(cogs)],['هزینه‌های جاری',money(expenses)],['سود خالص',money(profit)]])+'</div>'}
function activity(){return '<div class="page-head"><h2>دفتر فعالیت سیستم</h2><span class="badge">'+db.activities.length+' رویداد</span></div><div class="toolbar"><input id="search" placeholder="جستجو در فعالیت‌ها..." value="'+esc(query)+'"></div><div class="card">'+activityRows(500).split('</div>').join('</div>').replaceAll('','')+'</div>'}
function settings(){return '<div class="page-head"><h2>تنظیمات</h2></div><div class="two"><div class="card"><div class="section">رنگ برنامه</div><div class="swatches">'+[['green','#123b32'],['blue','#1d3d72'],['purple','#513575'],['orange','#873e1c']].map(([k,c])=>'<button class="swatch '+(db.theme===k?'active':'')+'" style="background:'+c+'" data-theme="'+k+'" aria-label="'+k+'"></button>').join('')+'</div><div class="section">پروفایل صاحب برنامه</div><form id="profile"><label>نام</label><input name="name" value="'+esc(db.profile.name)+'"><label>عنوان</label><input name="title" value="'+esc(db.profile.title)+'"><label>شماره تماس</label><input name="phone" value="'+esc(db.profile.phone)+'"><label>ایمیل</label><input name="email" value="'+esc(db.profile.email)+'"><button class="primary">ذخیره</button></form></div><div class="card"><div class="section">مدیریت کاربران</div>'+(db.activeUser.role==='admin'?table(['نام','نام کاربری','سطح دسترسی'],db.users.map(u=>[esc(u.name),esc(u.username),u.role==='admin'?'مدیر':'کاربر']))+'<button class="primary" data-act="new-user">＋ افزودن کاربر جدید</button>':'<p class="hint">مدیریت کاربران فقط برای مدیر اصلی فعال است.</p>')+'</div><div class="card"><div class="section">پشتیبان‌گیری و بازیابی</div><p class="hint">پشتیبان شامل کالاها، فروش‌ها، مشتریان، صندوق و تنظیمات است. فایل را در جای امن نگهداری کن.</p><div class="actions"><button data-act="backup">دانلود پشتیبان JSON</button><label class="secondary" style="padding:12px;border-radius:12px;cursor:pointer">بازیابی فایل<input id="restore" type="file" accept="application/json" hidden></label></div><div class="section">درباره نرم‌افزار</div><p>Tavaana Business نسخه ۳ · مدیریت آفلاین کسب‌وکار</p><p class="hint">ساخته‌شده برای Mohammad Ali Tavaana · واحد پول افغانی</p><button class="danger" data-act="logout">خروج از حساب</button></div></div>'}
function table(head,rows){if(!rows.length)return '<div class="empty">موردی برای نمایش وجود ندارد.</div>';return '<div class="tablewrap"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
const views={home,sales,stock,people,cash,reports,activity,settings};
function openModal(title,body,onSubmit){let old=$('#modal');old?.remove();document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="modal"><div class="modal"><div class="modalhead"><h3>'+title+'</h3><button class="secondary" id="close">بستن</button></div>'+body+'</div></div>');$('#close').onclick=()=>$('#modal').remove();if(onSubmit)$('#modal form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target),e.target)}}
function productForm(p){openModal(p?'ویرایش کالا':'افزودن کالا','<form><div class="formgrid"><div class="full"><label>نام کالا</label><input name="name" required value="'+esc(p?.name||'')+'"></div><div><label>کد کالا</label><input name="code" value="'+esc(p?.code||'')+'"></div><div><label>دسته‌بندی</label><input name="category" value="'+esc(p?.category||'لوازم جانبی موبایل')+'"></div><div><label>موجودی</label><input name="qty" type="number" min="0" required value="'+(p?.qty??0)+'"></div><div><label>حد هشدار</label><input name="minQty" type="number" min="0" value="'+(p?.minQty??2)+'"></div><div><label>قیمت خرید</label><input name="buy" type="number" min="0" required value="'+(p?.buy??0)+'"></div><div><label>قیمت فروش</label><input name="sell" type="number" min="0" required value="'+(p?.sell??0)+'"></div></div><button class="primary">ذخیره کالا</button></form>',f=>{let x=Object.fromEntries(f);let item={...p,id:p?.id||uid(),name:x.name.trim(),code:x.code.trim(),category:x.category.trim(),qty:+x.qty,minQty:+x.minQty,buy:+x.buy,sell:+x.sell};if(p)db.products=db.products.map(z=>z.id===p.id?item:z);else db.products.push(item);log('product',p?'ویرایش کالا: '+item.name:'افزودن کالا: '+item.name);save();$('#modal').remove();render();toast('کالا ذخیره شد')})}
function saleForm(){if(!db.products.length)return toast('ابتدا کالا به انبار اضافه کن.');draftItems=[];const options=()=>db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · موجودی '+p.qty+' · '+money(p.sell)+'</option>').join('');openModal('ثبت فروش چندقلمی','<form id="saleform"><label>مشتری (برای فروش نسیه الزامی)</label><select name="customerId"><option value="">فروش نقدی / مشتری گذری</option>'+db.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><div class="section">اقلام فاکتور</div><div id="lines"></div><button type="button" class="secondary" id="addline">＋ افزودن قلم</button><div class="formgrid"><div><label>تخفیف</label><input name="discount" type="number" min="0" value="0"></div><div><label>مبلغ پرداخت‌شده</label><input name="paidAmount" type="number" min="0" value="0"></div></div><div class="totalbox"><span>مجموع فاکتور: <b id="subtotal">۰</b></span><span>سود: <b id="profit">۰</b></span></div><label>تاریخ</label><input name="date" type="date" value="'+today()+'"><button class="primary">ثبت فروش و کسر موجودی</button></form>',f=>{try{const items=[...$('#lines').querySelectorAll('.lineitem')].map(el=>({productId:el.querySelector('select').value,quantity:+el.querySelector('input').value}));const data=Object.fromEntries(f);let result=processSale(db,{...data,discount:+data.discount,paidAmount:+data.paidAmount,items});db={...db,...result.state};log('sale','ثبت فاکتور فروش',result.sale.revenue);save();$('#modal').remove();page='sales';render();toast('فروش ثبت شد؛ موجودی انبار به‌روز شد')}catch(e){toast(e.message)}});function addLine(){let d=document.createElement('div');d.className='lineitem';d.innerHTML='<div class="wide"><label>کالا</label><select>'+options()+'</select></div><div><label>تعداد</label><input type="number" min="1" value="1"></div><button type="button" class="remove">×</button>';d.querySelector('.remove').onclick=()=>{d.remove();calc()};d.querySelectorAll('select,input').forEach(x=>x.oninput=calc);$('#lines').append(d);calc()}function calc(){try{let items=[...$('#lines').querySelectorAll('.lineitem')].map(el=>{let p=db.products.find(x=>x.id===el.querySelector('select').value);return {quantity:+el.querySelector('input').value,unitPrice:p.sell,unitCost:p.buy}});let t=calculateSaleTotals(items,+$('#saleform [name=discount]').value);$('#subtotal').textContent=money(t.revenue);$('#profit').textContent=money(t.grossProfit)}catch{$('#subtotal').textContent='—';$('#profit').textContent='—'}}$('#addline').onclick=addLine;$('#saleform [name=discount]').oninput=calc;addLine()}
function simpleForm(title,fields,submit){
  const body = `<form><div class="formgrid">${fields.map(f=>`<div class="${f.full?'full':''}"><label>${esc(f.label)}</label>${f.options?`<select name="${esc(f.name)}">${f.options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<input name="${esc(f.name)}" type="${f.type||'text'}" ${f.required===false?'':'required'} ${f.value!==undefined?`value="${esc(f.value)}"`:''} ${f.min!==undefined?`min="${f.min}"`:''}>`}</div>`).join('')}</div><button class="primary">ذخیره</button></form>`;
  openModal(title,body,submit);
}
function userForm(){if(db.activeUser?.role!=='admin')return toast('فقط مدیر می‌تواند کاربر بسازد.');openModal('افزودن کاربر جدید','<form><label>نام کاربر</label><input name="name" required><label>نام کاربری</label><input name="username" required autocomplete="off"><label>رمز عبور (حداقل ۸ نویسه)</label><input name="password" type="password" minlength="8" required><label>سطح دسترسی</label><select name="role"><option value="staff">کاربر</option><option value="admin">مدیر</option></select><button class="primary">ساخت حساب</button></form>',async f=>{try{let x=Object.fromEntries(f),username=x.username.trim().toLowerCase();if(db.users.some(u=>u.username===username))throw Error('این نام کاربری قبلاً ثبت شده است.');if(x.password.length<8)throw Error('رمز عبور باید حداقل ۸ نویسه باشد.');let credential=await makeCredential(x.password);db.users.push({id:uid(),name:x.name.trim(),username,...credential,role:x.role});log('user','ساخت حساب کاربری: '+username);save();$('#modal').remove();render();toast('کاربر جدید ساخته شد')}catch(e){toast(e.message)}})}
function newCustomer(){simpleForm('افزودن مشتری',[{name:'name',label:'نام مشتری'},{name:'phone',label:'شماره تماس',required:false}],f=>{let x=Object.fromEntries(f);db.customers.push({id:uid(),name:x.name,phone:x.phone,balance:0});log('customer','افزودن مشتری: '+x.name);save();$('#modal').remove();render()})}
function newSupplier(){simpleForm('افزودن تأمین‌کننده',[{name:'name',label:'نام تأمین‌کننده'},{name:'phone',label:'شماره تماس',required:false}],f=>{let x=Object.fromEntries(f);db.suppliers.push({id:uid(),name:x.name,phone:x.phone,balance:0});log('supplier','افزودن تأمین‌کننده: '+x.name);save();$('#modal').remove();render()})}
function newIncome(){simpleForm('ثبت درآمد خدمات / متفرقه',[{name:'title',label:'شرح درآمد'},{name:'amount',label:'مبلغ',type:'number',min:1},{name:'section',label:'بخش',options:[['barber','خدمات / سلمانی'],['other','درآمد متفرقه']]},{name:'date',label:'تاریخ',type:'date',value:today()}],f=>{let x=Object.fromEntries(f);db.transactions.push({id:uid(),type:'income',section:x.section,title:x.title,amount:+x.amount,cost:0,date:x.date,createdAt:new Date().toISOString()});db.cashbox+=+x.amount;db.cashMovements.push({id:uid(),direction:'in',kind:'درآمد خدمات',description:x.title,amount:+x.amount,date:x.date});log('income','ثبت درآمد: '+x.title,+x.amount);save();$('#modal').remove();render();toast('درآمد ثبت شد')})}
function newExpense(){simpleForm('ثبت هزینه',[{name:'title',label:'شرح هزینه'},{name:'amount',label:'مبلغ',type:'number',min:1},{name:'date',label:'تاریخ',type:'date',value:today()}],f=>{try{let x=Object.fromEntries(f);db=recordExpense(db,{...x,amount:+x.amount});log('expense','ثبت هزینه: '+x.title,+x.amount);save();$('#modal').remove();render();toast('هزینه ثبت شد')}catch(e){toast(e.message)}})}
function newReceipt(customerId){simpleForm('دریافت وجه از مشتری',[{name:'customerId',label:'مشتری',options:db.customers.map(c=>[c.id,c.name+' · بدهی '+money(c.balance)]),value:customerId||''},{name:'amount',label:'مبلغ دریافتی',type:'number',min:1},{name:'date',label:'تاریخ',type:'date',value:today()}],f=>{try{let x=Object.fromEntries(f);db=recordReceipt(db,{...x,amount:+x.amount});log('receipt','دریافت از مشتری',+x.amount);save();$('#modal').remove();render();toast('دریافت ثبت شد')}catch(e){toast(e.message)}})}
function newPayment(){simpleForm('پرداخت از صندوق',[{name:'supplierId',label:'تأمین‌کننده (اختیاری)',required:false,options:[['','پرداخت عمومی'],...db.suppliers.map(s=>[s.id,s.name+' · طلب '+money(s.balance||0)])]},{name:'title',label:'شرح پرداخت',required:false},{name:'amount',label:'مبلغ',type:'number',min:1},{name:'date',label:'تاریخ',type:'date',value:today()}],f=>{try{let x=Object.fromEntries(f);if(x.supplierId){db=recordSupplierPayment(db,{supplierId:x.supplierId,amount:+x.amount,date:x.date})}else{if(+x.amount>db.cashbox)throw Error('موجودی صندوق کافی نیست.');db.cashbox-=+x.amount;db.cashMovements.push({id:uid(),direction:'out',kind:'پرداخت عمومی',description:x.title||'پرداخت',amount:+x.amount,date:x.date})}log('payment',x.supplierId?'پرداخت به تأمین‌کننده':'پرداخت: '+(x.title||''),+x.amount);save();$('#modal').remove();render();toast('پرداخت ثبت شد')}catch(e){toast(e.message)}})}
function newPurchase(){if(!db.products.length)return toast('ابتدا کالا تعریف کن.');simpleForm('ثبت خرید و افزایش موجودی',[{name:'productId',label:'کالا',options:db.products.map(p=>[p.id,p.name])},{name:'supplierId',label:'تأمین‌کننده (برای خرید نسیه الزامی)',required:false,options:[['','خرید نقدی / بدون تأمین‌کننده'],...db.suppliers.map(s=>[s.id,s.name])]},{name:'quantity',label:'تعداد',type:'number',min:1},{name:'unitCost',label:'قیمت خرید هر عدد',type:'number',min:0},{name:'paidAmount',label:'مبلغ پرداخت‌شده',type:'number',min:0},{name:'date',label:'تاریخ',type:'date',value:today()}],f=>{try{let x=Object.fromEntries(f);db=recordPurchase(db,{...x,quantity:+x.quantity,unitCost:+x.unitCost,paidAmount:+x.paidAmount});log('purchase','ثبت خرید کالا',+x.quantity*+x.unitCost);save();$('#modal').remove();render();toast('خرید ثبت شد؛ موجودی و حساب تأمین‌کننده به‌روز شد')}catch(e){toast(e.message)}})}
function backup(){let blob=new Blob([JSON.stringify({...db,backupVersion:3,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tavaana-Business-V3-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('پشتیبان دانلود شد')}
function restore(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.products)||!Array.isArray(x.users))throw Error();if(!confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟'))return;db={...blank(),...x,activeUser:null};save();render();toast('بازیابی شد؛ دوباره وارد شو')}catch{toast('فایل پشتیبان معتبر نیست')}};r.readAsText(file)}
function exportCSV(){let rows=[['date','sale_id','revenue','cost','profit','paid','outstanding'],...db.sales.map(s=>[s.date,s.id,s.revenue,s.costOfGoods,s.profit,s.paidAmount,s.outstanding])];let csv='\ufeff'+rows.map(r=>r.join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Tavaana-Sales-'+today()+'.csv';a.click()}
async function passwordHash(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:210000,hash:'SHA-256'},material,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function randomSalt(){return [...crypto.getRandomValues(new Uint8Array(16))]}
async function makeCredential(password){const salt=randomSalt();return {passwordHash:await passwordHash(password,salt),passwordSalt:salt}}
function bindLogin(){$('#setup')?.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),pin=String(f.get('pin'));if(!crypto.subtle)return toast('مرورگر از رمزنگاری امن پشتیبانی نمی‌کند.');try{const credential=await makeCredential(pin),recovery=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(),recoverySalt=randomSalt();db.users=[{id:uid(),name:f.get('name'),username:f.get('username').toLowerCase(),...credential,recoveryHash:await passwordHash(recovery,recoverySalt),recoverySalt,role:'admin'}];db.activeUser=db.users[0];save();alert('کلید بازیابی مدیر (فقط همین یک‌بار نمایش داده می‌شود):\n\n'+recovery+'\n\nآن را یادداشت و در جای امن نگهداری کن. اگر حافظه مرورگر پاک شود و این کلید یا پشتیبان را نداشته باشی، بازیابی ممکن نیست.');render()}catch(err){toast('ساخت حساب ناموفق بود: '+err.message)}});$('#login')?.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.username===f.get('username').toLowerCase()),pin=String(f.get('pin'));if(!u)return toast('نام کاربری یا رمز نادرست است');try{let valid=u.passwordHash?await passwordHash(pin,u.passwordSalt)===u.passwordHash:u.pin===pin;if(!valid)return toast('نام کاربری یا رمز نادرست است');if(!u.passwordHash){const credential=await makeCredential(pin);Object.assign(u,credential);delete u.pin;save()}db.activeUser=u;save();render()}catch{toast('ورود امن انجام نشد')}});
$('#recover')?.addEventListener('click',async()=>{try{const username=prompt('نام کاربری مدیر را وارد کن:'),u=db.users.find(x=>x.username===String(username||'').toLowerCase());if(!u)return toast('حساب پیدا نشد');if(!u.recoveryHash||!u.recoverySalt)return toast('برای این حساب کلید بازیابی ثبت نشده است.');const key=prompt('کلید بازیابی مدیر را وارد کن:');if(!key)return;const valid=await passwordHash(key.trim().toUpperCase(),u.recoverySalt)===u.recoveryHash;if(!valid)return toast('کلید بازیابی نادرست است.');const next=prompt('رمز عبور جدید (حداقل ۸ نویسه):');if(!next||next.length<8)return toast('رمز جدید باید حداقل ۸ نویسه باشد.');Object.assign(u,await makeCredential(next));delete u.pin;db.activeUser=u;save();render();toast('رمز مدیر با موفقیت تغییر کرد')}catch{toast('بازیابی رمز انجام نشد')}});}
function bind(){$$('.nav,.bottomnav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});$$('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==='logout'){db.activeUser=null;save();render()}if(a==='backup')backup();if(a==='new-sale')saleForm();if(a==='new-user')userForm();if(a==='new-product')productForm();if(a==='new-expense')newExpense();if(a==='new-income')newIncome();if(a==='new-customer')newCustomer();if(a==='new-supplier')newSupplier();if(a==='new-receipt')newReceipt();if(a==='new-payment')newPayment();if(a==='new-purchase')newPurchase();if(a==='export-csv')exportCSV()});$$('[data-edit]').forEach(b=>b.onclick=()=>productForm(db.products.find(p=>p.id===b.dataset.edit)));$$('[data-receive]').forEach(b=>b.onclick=()=>newReceipt(b.dataset.receive));$$('[data-theme]').forEach(b=>b.onclick=()=>{db.theme=b.dataset.theme;save();render()});$('#search')?.addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();let el=$('#search');el?.focus();el?.setSelectionRange(pos,pos)});$('#profile')?.addEventListener('submit',e=>{e.preventDefault();db.profile={...db.profile,...Object.fromEntries(new FormData(e.target))};save();toast('مشخصات ذخیره شد')});$('#restore')?.addEventListener('change',e=>{if(e.target.files[0])restore(e.target.files[0])})}
